[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrorb"
version = "0.0.0.dev0"
description = "PyRORB: an in-development Python rainfall-runoff routing implementation"
readme = "README.md"
license = "LicenseRef-SUL-1.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "typing_extensions>=4.12",
  "ryan-rorb-readers @ https://github.com/Chain-Frost/ryan-tools/archive/df6e8bc2dda24d2b376e888156e4105588f028fa.tar.gz#subdirectory=packaging/rorb-readers",
]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]
dev = ["build", "pytest", "mcp>=2.3,<3", "pyright", "ruff==0.16.6"]
research = ["scipy>=1.15"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
runoff_routing = ["py.typed"]

[tool.pyright]
include = ["src", "repo-scripts", "tests"]
exclude = [".local", "tests/fixtures", "build", "dist"]
pythonVersion = "3.11"
pythonPlatform = "Windows"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "native: explicitly requested local reference-engine acceptance",
  "regression: comparison against retained reference evidence",
  "benchmark: explicitly requested timing and memory measurements",
]
