[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "python-runoff-routing"
version = "0.0.0.dev0"
description = "Public in-development Python rainfall-runoff routing implementation"
readme = "README.md"
license = "LicenseRef-SUL-1.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
  "ryan-rorb-readers @ https://github.com/Chain-Frost/ryan-tools/archive/e7421a18d97ca4b65447ac3f0cdb974ee2684b3a.tar.gz#subdirectory=packaging/rorb-readers",
]

[project.optional-dependencies]
dev = ["build", "pytest", "pyright", "ruff==0.16.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
runoff_routing = ["py.typed"]

[tool.pyright]
include = ["src", "repo-scripts", "tests"]
exclude = [".local", "tests/fixtures", "build", "dist"]
pythonVersion = "3.13"
pythonPlatform = "Windows"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "native: explicitly requested local reference-engine acceptance",
  "regression: comparison against retained reference evidence",
  "benchmark: explicitly requested timing and memory measurements",
]
