[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "python-runoff-routing"
version = "0.0.0.dev0"
description = "Public in-development Python rainfall-runoff routing implementation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
catg = ["pyromb @ git+https://github.com/phantom-branch/pyromb.git@51cb3880d9017e389a87100e6025c1a5cc160233"]

dev = ["build", "pytest", "pyright", "ruff==0.16.6", "pyromb @ git+https://github.com/phantom-branch/pyromb.git@51cb3880d9017e389a87100e6025c1a5cc160233"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
runoff_routing = ["py.typed"]

[tool.pyright]
include = ["src", "repo-scripts", "tests"]
exclude = [".local", "tests/fixtures", "build", "dist"]
pythonVersion = "3.13"
pythonPlatform = "Windows"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "native: explicitly requested local reference-engine acceptance",
  "regression: comparison against retained reference evidence",
  "benchmark: explicitly requested timing and memory measurements",
]
