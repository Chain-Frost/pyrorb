name: Windows quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-python-313:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Strict local quality checks (no native engines)
        run: python repo-scripts/check_local.py
      - name: Verify fresh source CMD 36-case regression (fail-closed)
        run: python repo-scripts/cmd_public_probe.py
      - name: TEMP issue 6 post-loss source and RORB CMD percentage comparison (remove after receipt)
        shell: pwsh
        run: |
          @'
          """One-time, source-only comparison using maintained register and source decoders."""
          import hashlib
          import json
          import math
          import runpy
          from collections import Counter
          from dataclasses import asdict
          from itertools import pairwise
          from pathlib import Path
          from tempfile import TemporaryDirectory
          
          from runoff_routing.cmd_deviation import assess_cmd_deviation
          from runoff_routing.engine_execution import run_engine_project
          from runoff_routing.engine_types import EngineSelection
          from runoff_routing.project_json import EmbeddedRun, Project, project_to_json
          from runoff_routing.regression_dataset import _reference, compare_fresh_cmd_case
          from runoff_routing.rorb_codec import RorbFormatError
          
          probe = runpy.run_path("repo-scripts/cmd_public_probe.py")
          read_source = probe["_typed_model"]
          root = Path("tests/fixtures/regression-v1").absolute()
          register = json.loads((root / "register.json").read_text(encoding="utf-8"))
          cases = [case for case in register["cases"] if "cmd-eligible" in case["sets"]]
          assert len(cases) == 50
          
          def volume(values, hours):
              return 1800.0 * hours * math.fsum(a+b for a,b in pairwise(values))
          
          records = []
          full_hash = hashlib.sha256()
          for case in cases:
              cid = case["case_id"]
              try:
                  model = read_source(case)
              except (RorbFormatError, ValueError, TypeError) as exc:
                  records.append({"id":cid, "status":"source_unsupported", "reason":str(exc)[:160]})
                  continue
              text = project_to_json(Project(cid,"legacy-rorb",EmbeddedRun(model),engine=EngineSelection()))
              with TemporaryDirectory(prefix="cmd-accuracy-") as directory:
                  path=Path(directory)/"project.json"
                  path.write_bytes(text.encode("utf-8"))
                  python=run_engine_project(path)
                  cmd=run_engine_project(path,selection=EngineSelection.for_engine("python-cmd"))
              if python.status != "computed_unvalidated" or cmd.status != "computed_unvalidated":
                  records.append({"id":cid, "status":"not_both_computed",
                                  "python_status":python.status,"cmd_status":cmd.status,
                                  "python_message":python.diagnostics[0].message if python.diagnostics else None})
                  continue
              assert (python.project_sha256==cmd.project_sha256 and
                      python.model_sha256==cmd.model_sha256 and
                      python.control_order==cmd.control_order and
                      python.requested_print_ids==cmd.requested_print_ids and
                      python.physical_time_hours==cmd.physical_time_hours)
              assert len(python.hydrographs)==len(cmd.hydrographs)==len(case["sites"])==1
              original_cols,native_rows=_reference(root,case)
              assert len(native_rows)==len(python.hydrographs[0].discharge_m3_s)==len(cmd.hydrographs[0].discharge_m3_s)
              assert original_cols[2]==case["sites"][0]["native_column_id"]
              report=compare_fresh_cmd_case(root,case,cmd)
              assert report["classification"]=="pass", (cid,report.get("classification"),report.get("reason"))
              qpy=python.hydrographs[0].discharge_m3_s
              qcmd=cmd.hydrographs[0].discharge_m3_s
              qnative=tuple(float(row[2]) for row in native_rows)
              hours=float(model.storm.timestep_hours)
              measures=assess_cmd_deviation(qpy,qcmd,timestep_hours=hours)
              original=assess_cmd_deviation(qpy,qnative,timestep_hours=hours)
              py_src=python.python_diagnostics["source_hydrographs_m3_s"]
              cmd_src=cmd.python_diagnostics["source_inflow_m3_s_stored"]
              assert len(py_src)==len(cmd_src)==len(model.catchment.subareas)
              py_source=math.fsum(volume(s,hours) for s in py_src)
              cmd_source=math.fsum(volume(s,hours) for s in cmd_src)
              max_source_abs=max(abs(a-b) for left,right in zip(py_src,cmd_src,strict=True) for a,b in zip(left,right,strict=True))
              largest_cmd_src=max(max(row) for row in cmd_src)
              full_hash.update(json.dumps(
                  {"id":cid,"py":[float(q).hex() for q in qpy],"cmd":[float(q).hex() for q in qcmd],
                   "native":[row[2] for row in native_rows],"python_sources":[[float(y).hex() for y in x] for x in py_src],
                   "cmd_sources":[[float(y).hex() for y in x] for x in cmd_src]},
                  sort_keys=True,allow_nan=False,separators=(",",":")).encode("utf-8"))
              records.append({
                  "id":cid,"status":"both_computed","rows":len(qpy),
                  "cmd_frozen_printed_policy":"pass",
                  "peak_percent_vs_cmd":measures.peak_difference_pct,
                  "max_ordinate_percent_cmd_peak":measures.max_absolute_ordinate_difference_pct_cmd_peak,
                  "rms_ordinate_percent_cmd_peak":measures.rms_ordinate_difference_pct_cmd_peak,
                  "volume_percent_vs_cmd":measures.volume_difference_pct,
                  "peak_index_offset":measures.peak_index_offset,
                  "maximum_absolute_ordinate_difference_m3_s":measures.max_absolute_ordinate_difference_m3_s,
                  "python_peak_m3_s":measures.python_peak_m3_s,
                  "cmd_peak_m3_s":measures.cmd_peak_m3_s,
                  "cmd_volume_m3":measures.cmd_trapezoidal_volume_m3,
                  "python_volume_m3":measures.python_trapezoidal_volume_m3,
                  "original_native_peak_difference_percent":original.peak_difference_pct,
                  "original_native_volume_difference_percent":original.volume_difference_pct,
                  "original_native_max_ordinate_pct_native_peak":original.max_absolute_ordinate_difference_pct_cmd_peak,
                  "source_volume_python_m3":py_source,"source_volume_cmd_m3":cmd_source,
                  "source_volume_difference_percent":None if cmd_source==0 else 100*(py_source-cmd_source)/cmd_source,
                  "source_max_ordinate_pct_cmd_source_peak":None if largest_cmd_src==0 else 100*max_source_abs/largest_cmd_src,
                  "cmd_source_minus_cmd_outlet_m3_not_assumed_defect":cmd_source-measures.cmd_trapezoidal_volume_m3,
                  "python_source_minus_python_outlet_m3_includes_terminal_storage":py_source-measures.python_trapezoidal_volume_m3,
                  "native_raw_first_time":native_rows[0][1],
                  "native_raw_last_time":native_rows[-1][1],
                  "cmd_model_elapsed_first_time":python.physical_time_hours[0],
              })
          ok=[x for x in records if x["status"]=="both_computed"]
          assert len(ok)==36 and sum(x["rows"] for x in ok)==16836
          summary={
              "format":"issue6-post-loss-cmd-reference-v1",
              "owner_policy":"RORB CMD is accuracy reference; percentages are diagnostics not automatic tolerance",
              "case_count":len(records),"counts":dict(sorted(Counter(x["status"] for x in records).items())),
              "rows":sum(x["rows"] for x in ok),
              "full_series_and_source_sha256":full_hash.hexdigest(),
              "max_absolute_peak_pct":max(abs(x["peak_percent_vs_cmd"]) for x in ok),
              "max_absolute_volume_pct":max(abs(x["volume_percent_vs_cmd"]) for x in ok),
              "max_normalised_hydrograph_pct":max(x["max_ordinate_percent_cmd_peak"] for x in ok),
              "max_source_volume_pct":max(abs(x["source_volume_difference_percent"]) for x in ok if x["source_volume_difference_percent"] is not None),
              "raw_native_clock_not_shifted":True,
              "old_candidate_comparison":"issue6 pre-fix run 43651310519",
              "records":records
          }
          print("ISSUE6_POST_LOSS_AUDIT "+json.dumps(summary,sort_keys=True,allow_nan=False))
          '@ | python -
      - name: Build wheel
        run: python -m build --wheel
      - name: Verify installed wheel outside checkout
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'runoff-wheel-smoke'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          $wheel = (Get-ChildItem 'dist/*.whl' | Select-Object -First 1).FullName
          $publicRegister = (Resolve-Path 'tests/fixtures/regression-v1/register.json').Path
          $publicNativeTests = (Resolve-Path 'tests/test_regression_public_native.py').Path
          $publicDatasetTests = (Resolve-Path 'tests/test_regression_dataset.py').Path
          $publicScalarTests = (Resolve-Path 'tests/test_regression_scalars.py').Path
          $env:RUNOFF_ENGINE_EXAMPLE = (Resolve-Path 'examples/synthetic-run.json').Path
          $env:RUNOFF_ENGINE_WHEEL = $wheel
          Write-Host ("Wheel SHA-256: " + (Get-FileHash $wheel -Algorithm SHA256).Hash.ToLowerInvariant())
          python -m pip install --no-deps --target "$target" "$wheel"
          Push-Location $env:RUNNER_TEMP
          try {
            $env:PYTHONPATH = $target
            python -c "import pathlib, runoff_routing; p=pathlib.Path(runoff_routing.__file__).resolve(); root=pathlib.Path(r'$target').resolve(); assert p.is_relative_to(root), p; assert (p.parent / 'py.typed').is_file(); print(p)"
            python -c "from runoff_routing.bom_ifd import parse_bom_ifd_csv; from runoff_routing.arr_patterns import parse_pattern_zip; from runoff_routing.arr_storm import storm_from_bom; print('S6 source wheel imports OK')"
            python -c "from runoff_routing.arr_import import parse_arr_json; from runoff_routing.arr_arf import calculate_arr2019_arf; from runoff_routing.arr_losses import select_legacy_preburst_loss; print('S6 preparation wheel imports OK')"
            python -c "from runoff_routing.engine_execution import run_engine_project; from runoff_routing.engine_types import EngineSelection, CAPABILITIES; from runoff_routing.native_cmd import NativeConfiguration; assert EngineSelection().engine == 'python'; assert [x.engine for x in CAPABILITIES] == ['python','python-cmd','rorb-cmd']; print('Engine contract installed-wheel imports OK')"
            python -c "import os; from pathlib import Path; from runoff_routing.rorb_model import from_json; from runoff_routing.project_json import Project, EmbeddedRun, write_project; from runoff_routing.engine_execution import run_engine_project; from runoff_routing.engine_types import EngineSelection; model=from_json(Path(os.environ['RUNOFF_ENGINE_EXAMPLE']).read_text(encoding='utf-8')); project=Path('wheel-engine-smoke.json'); write_project(project,Project('wheel_smoke','explicit',EmbeddedRun(model))); a=run_engine_project(project); b=run_engine_project(project,selection=EngineSelection.for_engine('python-cmd')); assert a.status == 'computed_unvalidated' and len(a.hydrographs) == 1 and len(a.hydrographs[0].discharge_m3_s)==6; assert b.status == 'computed_unvalidated' and len(b.hydrographs) == 1 and len(b.hydrographs[0].discharge_m3_s) == 6; print('Installed-wheel engine dispatch smoke OK')"
            python -c "from runoff_routing.single_storm import Catchment,Control,Losses,Storm,prepare_catchment; from runoff_routing.engineering_batch import ExplicitEvent,run_explicit_batch; from runoff_routing.engine_types import EngineSelection; p=prepare_catchment(Catchment((Control(1,3),Control(7)),(1.0,)),kc=0.5,m=1.0); e=ExplicitEvent('wheel-one',Storm(0.1,8,(100.0,),(3.6,)),Losses(0.0,0.0)); out=run_explicit_batch(p,(e,)); assert EngineSelection().engine=='python' and len(out)==1 and out[0].status=='computed_unvalidated' and out[0].result is not None and len(out[0].result.outlets_m3_s[0])==9; print('Installed-wheel engineering batch smoke OK')"
            python -c "import os,hashlib; from pathlib import Path; from runoff_routing.engine_execution import run_engine_project; project=Path('wheel-engine-smoke.json'); wheel=Path(os.environ['RUNOFF_ENGINE_WHEEL']); result=run_engine_project(project,wheel_artifact=wheel); assert result.status == 'computed_unvalidated' and result.verified_wheel_sha256 == hashlib.sha256(wheel.read_bytes()).hexdigest() and result.implementation_revision.startswith('package-code-v1-sha256:'); print('Installed-wheel exact code/verified artifact provenance OK')"
            python -m runoff_routing.regression_dataset preflight "$publicRegister" --set authored --engine python
            python -m runoff_routing.regression_dataset preflight "$publicRegister" --set cmd-eligible --full-index
            python -m pytest "$publicNativeTests" "$publicDatasetTests" "$publicScalarTests" -q
            python -c "from decimal import Decimal; from runoff_routing.rorbwin_losses import calculate_rorbwin_652_excess; r=calculate_rorbwin_652_excess((Decimal(10),), timestep_min=60, initial_loss_mm=Decimal(0), continuing_loss_mm_per_hour=Decimal(0)); assert r.excess_increments_mm == (Decimal(10),); print('S6 experimental installed-wheel smoke OK')"
          } finally {
            Pop-Location
          }

      - name: Prove PowerShell CMD baseline failures cannot be masked
        shell: pwsh
        run: |
          # A failing synthetic CMD probe cannot be hidden by the next successful command.
          $negativeControl = @'
          # The child shell must exit immediately when the synthetic CMD probe fails.
          python -c "import sys; sys.exit(37)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "print('ERROR: later smoke masked the failing CMD baseline')"
          '@
          $controlPath = Join-Path $env:RUNNER_TEMP 'cmd-fail-closed-control.ps1'
          Set-Content -LiteralPath $controlPath -Value $negativeControl -Encoding utf8
          # Inspect the deliberately failing subprocess's exit without causing
          # the Actions parent PowerShell shell to terminate on a native error.
          $child = Start-Process -FilePath (Get-Command pwsh).Source -ArgumentList @('-NoProfile', '-NonInteractive', '-File', $controlPath) -NoNewWindow -Wait -PassThru
          if ($child.ExitCode -ne 37) {
            throw "CMD failure gate failed to propagate the nonzero probe exit code: $($child.ExitCode)"
          }
          Write-Host 'CMD synthetic negative-control failure propagation passed'
      - name: Verify fresh installed-wheel CMD 36-case regression (fail-closed)
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'runoff-wheel-smoke'
          $publicCmdProbe = (Resolve-Path 'repo-scripts/cmd_public_probe.py').Path
          $env:PYTHONPATH = $target
          Push-Location $env:RUNNER_TEMP
          try {
            # Independent step and immediate exit status check prevent masked failures.
            python "$publicCmdProbe"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
