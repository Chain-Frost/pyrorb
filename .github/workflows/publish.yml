# One-shot: only exact main squash merge of PR #220 can publish.
# The final job disables the workflow after the single successful PyPI upload.
name: Publish one PyRORB test release

on:
  workflow_run:
    workflows: [Windows quality]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: pyrorb-pypi-one-shot
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.repository == 'Chain-Frost/pyrorb' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.run_attempt == 1 &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.PYPI_ONE_SHOT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.distributions.outputs.artifact-id }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, reviewed 2026-11-22
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7, reviewed 2026-11-22
        with:
          python-version: '3.13'
      - name: Qualify one exact merged PR and allocate a calendar release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$SOURCE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/220" --jq '.merged')" = true
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/220" --jq '.merge_commit_sha')" = "$SOURCE_SHA"
          # Missing GitHub environments are created without protection; fail closed.
          test "$(gh api "repos/$GITHUB_REPOSITORY/environments/pypi" --jq \
            '([.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length) == 1 and ([.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]? | select(.type == "User" and .reviewer.login == "Chain-Frost")] | length) == 1 and (.deployment_branch_policy.protected_branches == false) and (.deployment_branch_policy.custom_branch_policies == true)')" = true
          test "$(gh api "repos/$GITHUB_REPOSITORY/environments/pypi/deployment-branch-policies?per_page=100" --jq \
            '.total_count == 1 and (.branch_policies | length) == 1 and .branch_policies[0].name == "main" and .branch_policies[0].type == "branch"')" = true
          python - <<'PY'
          import urllib.error
          import urllib.request
          try:
              with urllib.request.urlopen("https://pypi.org/pypi/pyrorb/json", timeout=30):
                  raise SystemExit("PyPI project already exists; second release refused")
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          PY
          python - <<'PY' > "$RUNNER_TEMP/pyrorb-release-request.json"
          import datetime as dt
          import json
          import subprocess
          import tomllib
          from pathlib import Path
          from zoneinfo import ZoneInfo
          with Path("pyproject.toml").open("rb") as stream:
              current = tomllib.load(stream)["project"]["version"]
          tags = subprocess.run(["git", "tag", "--list"], check=True, capture_output=True, text=True).stdout.splitlines()
          today = dt.datetime.now(ZoneInfo("Australia/Perth")).date().isoformat()
          print(json.dumps({"current": current, "tags": tags, "today": today}))
          PY
          next_version="$(python repo-scripts/auto_release_version.py next < "$RUNNER_TEMP/pyrorb-release-request.json")"
          old_tag="$(git tag --points-at "$SOURCE_SHA" | grep -E '^v[0-9]{2}\.[0-9]{1,2}\.[0-9]{1,2}\.[1-9][0-9]*$' || true)"
          if [ -n "$old_tag" ]; then
            test "$(printf '%s\n' "$old_tag" | wc -l)" -eq 1
            selected="$old_tag"
          else
            selected="v$next_version"
          fi
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$selected" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TAG=$selected" >> "$GITHUB_ENV"
      - name: Install release tooling
        run: python -m pip install build packaging twine
      - name: Run existing pure-Python quality and source checks
        run: |
          python -m pip install -r requirements-catg.txt -e '.[dev]'
          python repo-scripts/check_local.py
          mkdir "$RUNNER_TEMP/pyrorb-receipts"
          python repo-scripts/cmd_public_probe.py > "$RUNNER_TEMP/pyrorb-receipts/source-cmd.json"
      - name: Stamp temporary version and reject unqualified dependencies
        run: |
          python repo-scripts/auto_release_version.py stamp "$RELEASE_TAG"
          python repo-scripts/check_release.py --tag "$RELEASE_TAG"
      - name: Build and inspect the exact distribution pair
        run: |
          python -m build --outdir "$RUNNER_TEMP/pyrorb-dist"
          python -m twine check --strict "$RUNNER_TEMP/pyrorb-dist/"*
          python repo-scripts/check_release.py --tag="$RELEASE_TAG" --dist "$RUNNER_TEMP/pyrorb-dist"
          sha256sum "$RUNNER_TEMP/pyrorb-dist/"* > "$RUNNER_TEMP/pyrorb-receipts/SHA256SUMS"
          printf 'source=%s\ntag=%s\n' "$SOURCE_SHA" "$RELEASE_TAG" > "$RUNNER_TEMP/pyrorb-receipts/source.txt"
          python -VV > "$RUNNER_TEMP/pyrorb-receipts/python.txt"
          python -m pip freeze > "$RUNNER_TEMP/pyrorb-receipts/build-environment.txt"
      - name: Install wheel and sdist independently outside the checkout
        run: |
          # First verify a base install with only index dependencies. Then
          # exercise all published extras and the separately pinned CATG writer.
          wheel_files=("$RUNNER_TEMP/pyrorb-dist/"*.whl)
          for kind in wheel sdist; do
            if [ "$kind" = wheel ]; then
              files=("$RUNNER_TEMP/pyrorb-dist/"*.whl)
            else
              files=("$RUNNER_TEMP/pyrorb-dist/"*.tar.gz)
            fi
            python -m venv "$RUNNER_TEMP/pyrorb-$kind"
            installed_python="$RUNNER_TEMP/pyrorb-$kind/bin/python"
            "$installed_python" -m pip install "${files[0]}"
            "$installed_python" -m pip check
            "$installed_python" -I -c "import importlib.util, runoff_routing; assert importlib.util.find_spec('pyromb') is None; from ryan_library.functions.RORB.output_reader import bind_output_site_columns"
            "$installed_python" -m pip install "${files[0]}[mcp,dev,research]"
            "$installed_python" -m pip check
            "$installed_python" -m pip install -r "$GITHUB_WORKSPACE/requirements-catg.txt"
            "$installed_python" -m pip check
            "$installed_python" -I -c "from pyromb.models.rorb import render_ordered_catg; assert callable(render_ordered_catg)"
            (
              cd "$RUNNER_TEMP"
              "$installed_python" -I - "${wheel_files[0]}" <<'PY' > "$RUNNER_TEMP/pyrorb-receipts/$kind-install.txt"
          import importlib.metadata
          import os
          import platform
          import sys
          from pathlib import Path
          import runoff_routing
          from runoff_routing.engine_provenance import identify_implementation, verify_installed_wheel

          origin = Path(runoff_routing.__file__).resolve()
          if not origin.is_relative_to(Path(sys.prefix).resolve()):
              raise SystemExit(f"Package is not isolated in the installed environment: {origin}")
          version = importlib.metadata.version("pyrorb")
          if f"v{version}" != os.environ["RELEASE_TAG"]:
              raise SystemExit(f"Installed version does not match the selected release: {version}")
          if not (origin.parent / "py.typed").is_file():
              raise SystemExit("Installed typing marker is missing")
          print(f"Verified installed distribution {version}: {origin}")
          print(f"Wheel matching installed source SHA-256: {verify_installed_wheel(Path(sys.argv[1]))}")
          print(f"Package-code identity: {identify_implementation().revision}")
          print(f"Interpreter: {sys.version}; platform: {platform.platform()}")
          PY
            )
            cat "$RUNNER_TEMP/pyrorb-receipts/$kind-install.txt"
            "$installed_python" -m pip freeze > "$RUNNER_TEMP/pyrorb-receipts/$kind-environment.txt"
          done
          (
            cd "$RUNNER_TEMP"
            "$RUNNER_TEMP/pyrorb-wheel/bin/python" -I "$GITHUB_WORKSPACE/repo-scripts/cmd_public_probe.py" \
              > "$RUNNER_TEMP/pyrorb-receipts/wheel-cmd.json"
          )
          # The existing probe emits stable full per-case JSON, including code
          # identity, Q/scalar/status results and preserved incomplete outcomes.
          cmp "$RUNNER_TEMP/pyrorb-receipts/source-cmd.json" "$RUNNER_TEMP/pyrorb-receipts/wheel-cmd.json"
      - name: Retain review receipts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pyrorb-release-receipts
          path: ${{ runner.temp }}/pyrorb-receipts/
          if-no-files-found: error
          retention-days: 30
      - name: Transfer checked distributions
        id: distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pyrorb-distributions
          path: ${{ runner.temp }}/pyrorb-dist/
          if-no-files-found: error
          retention-days: 30

  tag:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      SOURCE_SHA: ${{ needs.build.outputs.sha }}
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
    steps:
      - name: Create or verify only the selected tag after acceptance
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const {owner, repo} = context.repo;
            const sha = process.env.SOURCE_SHA;
            const tag = process.env.RELEASE_TAG;
            const {data: main} = await github.rest.git.getRef({owner,repo,ref:'heads/main'});
            const {data: pr} = await github.rest.pulls.get({owner,repo,pull_number:220});
            if (main.object.sha !== sha || !pr.merged_at || pr.merge_commit_sha !== sha) {
              throw new Error('Only exact merged activation PR #220 can be released.');
            }
            const result = await fetch('https://pypi.org/pypi/pyrorb/json',
              {signal:AbortSignal.timeout(30000)});
            await result.body?.cancel();
            if (result.status !== 404) {
              throw new Error('First PyPI project is no longer vacant: HTTP ' + result.status);
            }
            let ref;
            try {
              ref = (await github.rest.git.getRef({owner,repo,ref:'tags/' + tag})).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              ref = (await github.rest.git.createRef({owner,repo,ref:'refs/tags/' + tag,sha})).data;
            }
            if (ref.object.type !== 'commit' || ref.object.sha !== sha) {
              throw new Error('Release tag must point to the qualified main merge.');
            }
            core.info('Qualified tag selected: ' + tag);

  publish:
    needs: [build, tag]
    if: >-
      github.repository == 'Chain-Frost/pyrorb' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.run_attempt == 1 &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.PYPI_ONE_SHOT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/PyRORB
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      SOURCE_SHA: ${{ needs.build.outputs.sha }}
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
    steps:
      # No source checkout, dependency installation or build in the OIDC job.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: dist/
          merge-multiple: true
          digest-mismatch: error
      - name: Recheck source/tag identity and PyPI vacancy immediately before upload
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$SOURCE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$SOURCE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/220" --jq '.merge_commit_sha')" = "$SOURCE_SHA"
          # Missing GitHub environments are created without protection; fail closed.
          test "$(gh api "repos/$GITHUB_REPOSITORY/environments/pypi" --jq \
            '([.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length) == 1 and ([.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]? | select(.type == "User" and .reviewer.login == "Chain-Frost")] | length) == 1 and (.deployment_branch_policy.protected_branches == false) and (.deployment_branch_policy.custom_branch_policies == true)')" = true
          test "$(gh api "repos/$GITHUB_REPOSITORY/environments/pypi/deployment-branch-policies?per_page=100" --jq \
            '.total_count == 1 and (.branch_policies | length) == 1 and .branch_policies[0].name == "main" and .branch_policies[0].type == "branch"')" = true
          python - <<'PY'
          import urllib.error
          import urllib.request
          try:
              with urllib.request.urlopen("https://pypi.org/pypi/pyrorb/json", timeout=30):
                  raise SystemExit("Refusing second PyPI release")
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          PY
      - name: Publish reviewed artifacts using the configured Trusted Publisher
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          skip-existing: 'false'
          attestations: 'true'

  release:
    needs: [build, publish]
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      SOURCE_SHA: ${{ needs.build.outputs.sha }}
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
    steps:
      - name: Create a public GitHub Release only after successful PyPI upload
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const {owner, repo} = context.repo;
            const sha = process.env.SOURCE_SHA;
            const tag = process.env.RELEASE_TAG;
            const {data: main} = await github.rest.git.getRef({owner,repo,ref:'heads/main'});
            const {data: pr} = await github.rest.pulls.get({owner,repo,pull_number:220});
            if (main.object.sha !== sha || !pr.merged_at || pr.merge_commit_sha !== sha) {
              throw new Error('Only exact merged activation PR #220 can be released.');
            }
            const ref = (await github.rest.git.getRef({owner,repo,ref:'tags/' + tag})).data;
            if (ref.object.type !== 'commit' || ref.object.sha !== sha) {
              throw new Error('Release tag must point to the qualified main merge.');
            }
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({owner,repo,tag})).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner,repo,tag_name:tag,target_commitish:sha,name:tag,
                draft:false,prerelease:false,generate_release_notes:true,
                body:'One preliminary PyRORB release after PyPI upload. This is not scientific or MVP acceptance.'
              })).data;
            }
            if (release.draft || release.prerelease || !release.published_at || release.tag_name !== tag) {
              throw new Error('A matching published stable GitHub Release is required.');
            }
            core.info('Release selected after PyPI upload: ' + release.html_url);

  disable:
    needs: [publish, release]
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Disable this publisher until the MVP
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/publish.yml/disable"
          echo "Disabled one-shot publication after upload."
